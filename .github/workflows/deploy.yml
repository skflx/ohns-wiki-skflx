name: Deploy sk.oto Knowledge Graph to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git history for accurate "last modified" dates

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Refuse private material
        run: |
          if grep -rIl --include='*.md' -e '^## Personal Notes' content/; then
            echo "::error::Personal Notes section found in content/ — re-run sync_vault.py --publish"; exit 1; fi
          if [ -e content/data_sources ] || [ -e content/_drafts ] || [ -e content/.agents ]; then
            echo "::error::private vault folder found in content/"; exit 1; fi

      - name: Palette sync (advisory)
        continue-on-error: true
        run: node scripts/check-signal.mjs

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
